service_id: svc_ai_automation_bot
name: AI 업무 자동화 상담봇
description: 소상공인과 개인사업자를 대상으로 반복적인 장부 정리, 고객 문자 발송, 예약 관리, 문서 자동화를 도와주는 AI 업무 자동화 상담봇
target_users:
  - 소상공인
  - 개인사업자
  - 사무직
  - 프리랜서
service_capabilities:
  - 업무 자동화 상담
  - 자동화 가능 업무 진단
  - 가격 안내
  - 도입 절차 설명
known_limits:
  - 복잡한 ERP 연동은 별도 견적 필요
  - 개인정보 처리 시 별도 동의 필요
  - 업무 양식 변경 시 유지보수 범위 확인 필요
prohibited_claims:
  - 모든 업무를 무조건 자동화할 수 있다는 표현
  - 개인정보 처리를 별도 동의 없이 보장한다는 표현
  - 자동화 오류 책임을 모두 면제한다는 표현
